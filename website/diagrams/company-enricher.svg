<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" font-family="Inter, Helvetica, Arial, sans-serif">
<title>The Company Enricher</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b5c52"/></marker></defs>
<rect width="720" height="360" fill="#ffffff"/>
<rect x="30" y="40" width="190" height="78" rx="12" fill="#f5f0eb" stroke="#c4825a" stroke-width="2"/>
<text x="125.0" y="73" text-anchor="middle" font-size="16" font-weight="600" fill="#2c2420">1. Company name</text>
<text x="125.0" y="96" text-anchor="middle" font-size="13" fill="#6b5c52">the input</text>
<rect x="265" y="40" width="190" height="78" rx="12" fill="#f5f0eb" stroke="#c4825a" stroke-width="2"/>
<text x="360.0" y="73" text-anchor="middle" font-size="16" font-weight="600" fill="#2c2420">2. Official website</text>
<text x="360.0" y="96" text-anchor="middle" font-size="13" fill="#6b5c52">found, then verified</text>
<rect x="500" y="40" width="190" height="78" rx="12" fill="#f5f0eb" stroke="#c4825a" stroke-width="2"/>
<text x="595.0" y="73" text-anchor="middle" font-size="16" font-weight="600" fill="#2c2420">3. About page</text>
<text x="595.0" y="96" text-anchor="middle" font-size="13" fill="#6b5c52">read as text</text>
<rect x="30" y="200" width="190" height="78" rx="12" fill="#f5f0eb" stroke="#c4825a" stroke-width="2"/>
<text x="125.0" y="233" text-anchor="middle" font-size="16" font-weight="600" fill="#2c2420">4. Activity summary</text>
<text x="125.0" y="256" text-anchor="middle" font-size="13" fill="#6b5c52">main business activity</text>
<rect x="265" y="200" width="190" height="78" rx="12" fill="#fbeee6" stroke="#c4825a" stroke-width="2"/>
<text x="360.0" y="233" text-anchor="middle" font-size="16" font-weight="600" fill="#2c2420">5. Category suggestion</text>
<text x="360.0" y="256" text-anchor="middle" font-size="13" fill="#6b5c52">category, confidence</text>
<rect x="500" y="200" width="190" height="78" rx="12" fill="#f5f0eb" stroke="#c4825a" stroke-width="2"/>
<text x="595.0" y="233" text-anchor="middle" font-size="16" font-weight="600" fill="#2c2420">6. Evidence and review</text>
<text x="595.0" y="256" text-anchor="middle" font-size="13" fill="#6b5c52">source text kept</text>
<line x1="224" y1="79.0" x2="259" y2="79.0" stroke="#6b5c52" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="459" y1="79.0" x2="494" y2="79.0" stroke="#6b5c52" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="224" y1="239.0" x2="259" y2="239.0" stroke="#6b5c52" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="459" y1="239.0" x2="494" y2="239.0" stroke="#6b5c52" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M595.0,122 V159.0 H125.0 V194" fill="none" stroke="#6b5c52" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M360.0,282 V312" fill="none" stroke="#c86b5a" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<text x="360.0" y="334" text-anchor="middle" font-size="13" fill="#c86b5a">low confidence or ambiguous: human review</text>
</svg>
